name: Deploy HINES to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/hines/app
            git fetch --depth 1 origin main
            git reset --hard origin/main
            /opt/hines/venv/bin/pip install -q -r requirements.txt
            cd backend
            set -a; . /opt/hines/app/.env; set +a
            /opt/hines/venv/bin/python manage.py migrate --noinput
            /opt/hines/venv/bin/python manage.py collectstatic --noinput
            sudo systemctl restart hines
            echo "Deployed $(git -C /opt/hines/app rev-parse --short HEAD)"
